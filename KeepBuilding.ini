; KeepBuilding - Moon Sweepers
; Keeps the selected building on the hammer after placing it.
; Changes are picked up LIVE while the game is running (next time you place something).

[KeepBuilding]
; 1 = on, 0 = vanilla behaviour
; (a game started with 0 needs a restart to turn it on)
Enabled=1

; Machines with conveyor ports switch to the conveyor tool after placing them.
; 0 = keep the machine selected, 1 = switch to the conveyor tool (vanilla)
ConveyorAfterMachine=0

; Write KeepBuilding.log to the game folder
Log=1
