name: Bug report
description: The mod doesn't work, crashes, or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please attach your **KeepBuilding.log** from the game folder. Without it, the problem is
        almost impossible to diagnose.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Linux (Proton)
        - Steam Deck
        - Other
    validations:
      required: true
  - type: input
    id: building
    attributes:
      label: Which building?
      description: The building you were placing when the problem happened.
      placeholder: e.g. a machine with conveyor ports, a foundation module
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Selected a building with the hammer
        2. Placed it
        3. The selection was gone anyway
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: KeepBuilding.log
      description: Paste the contents of `KeepBuilding.log` from the game folder.
      render: text
    validations:
      required: true
  - type: textarea
    id: ini
    attributes:
      label: KeepBuilding.ini (if you changed it)
      render: ini
